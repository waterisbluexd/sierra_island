[package]
name = "sierra_island"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
smithay-client-toolkit = "0.21.1"
slint = { version = "=1.15.1", default-features = false, features = ["std", "renderer-software", "compat-1-2"] }
notify = "8.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
home = "0.5"
libc = "0.2.186"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[build-dependencies]
slint-build = "=1.15.1"
